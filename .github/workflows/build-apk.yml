name: Build GlassMic Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-24.04 already includes Android SDK. Avoid setup-android@v3,
      # whose extra sdkmanager invocation can fail before Gradle even starts.
      - name: Verify SDK and install only missing packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "SDK root: $sdk_root"
          test -d "$sdk_root" || { echo 'Android SDK not found on runner' >&2; exit 1; }

          # Detect NDK / CMake versions pinned directly in Gradle files.
          # Unpinned requirements are handled by Android Gradle Plugin.
          python3 - <<'PY' > "$RUNNER_TEMP/glassmic-sdk-packages.txt"
          import pathlib
          import re
          packages = {"platforms;android-35", "platforms;android-36", "build-tools;36.0.0"}
          files = list(pathlib.Path('.').rglob('*.gradle.kts')) + list(pathlib.Path('.').rglob('*.gradle'))
          for path in files:
              if any(part in ('.gradle', 'build') for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for value in re.findall(r'\bndkVersion\s*(?:=|\()\s*[\"\']([\d.]+)', text):
                  packages.add(f'ndk;{value}')
              for body in re.findall(r'\bcmake\s*\{([^{}]*)\}', text, flags=re.S):
                  for value in re.findall(r'\bversion\s*=\s*[\"\']([\d.]+)', body):
                      packages.add(f'cmake;{value}')
          print('\n'.join(sorted(packages)))
          PY

          echo 'Required SDK packages:'
          cat "$RUNNER_TEMP/glassmic-sdk-packages.txt"
          missing=()
          while IFS= read -r pkg; do
            [[ -n "$pkg" ]] || continue
            package_dir="$sdk_root/${pkg//;/\/}"
            if [[ -f "$package_dir/source.properties" ]]; then
              echo "Already installed: $pkg"
            else
              missing+=("$pkg")
            fi
          done < "$RUNNER_TEMP/glassmic-sdk-packages.txt"

          if (( ${#missing[@]} == 0 )); then
            echo 'All requested SDK packages are already installed; skipping sdkmanager.'
            exit 0
          fi

          if [[ -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]]; then
            manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            manager="$(command -v sdkmanager)"
          else
            echo 'sdkmanager was not found, but SDK packages are missing.' >&2
            find "$sdk_root/cmdline-tools" -name sdkmanager -type f -print || true
            exit 1
          fi

          echo "Using sdkmanager: $manager"
          # Retry transient network / repository failures and show the original error.
          for pkg in "${missing[@]}"; do
            ok=0
            for attempt in 1 2 3; do
              echo "Installing $pkg (attempt $attempt/3)"
              if "$manager" --sdk_root="$sdk_root" --install "$pkg"; then
                ok=1
                break
              fi
              if (( attempt < 3 )); then sleep 10; fi
            done
            if (( ok == 0 )); then
              echo "SDK package install failed: $pkg" >&2
              echo 'Check earlier sdkmanager stderr lines for the underlying cause.' >&2
              exit 1
            fi
          done

      - name: Assemble release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare release APK and optionally sign it
        id: apk
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk_dir='app/build/outputs/apk/release'
          if [[ ! -d "$apk_dir" ]]; then
            echo "Release APK output directory not found: $apk_dir" >&2
            exit 1
          fi
          mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | sort)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            find "$apk_dir" -maxdepth 2 -type f -print || true
            exit 1
          fi
          input_apk="${apks[0]}"
          build_tools="${ANDROID_HOME}/build-tools/36.0.0"
          mkdir -p dist

          present=0
          for value in "$RELEASE_KEYSTORE_BASE64" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD"; do
            [[ -z "$value" ]] || present=$((present + 1))
          done
          if (( present > 0 && present < 4 )); then
            echo 'Release signing secrets are incomplete (all four required).' >&2
            exit 1
          fi

          if (( present == 4 )); then
            keystore="${RUNNER_TEMP}/glassmic-release.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            aligned='dist/GlassMic-release-aligned.apk'
            "$build_tools/zipalign" -f -P 16 4 "$input_apk" "$aligned"
            output='dist/GlassMic-release-signed.apk'
            "$build_tools/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass env:RELEASE_STORE_PASSWORD \
              --key-pass env:RELEASE_KEY_PASSWORD \
              --out "$output" "$aligned"
            "$build_tools/apksigner" verify --verbose "$output"
            rm -f "$aligned" "$keystore"
          elif "$build_tools/apksigner" verify "$input_apk" >/dev/null 2>&1; then
            output='dist/GlassMic-release-signed.apk'
            cp "$input_apk" "$output"
          else
            output='dist/GlassMic-release-unsigned.apk'
            cp "$input_apk" "$output"
            echo 'No signing secrets provided: uploading an unsigned release APK.'
          fi

          test -s "$output"
          sha256sum "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          {
            echo '### GlassMic Release APK'
            echo ''
            echo "Gradle output: \`$input_apk\`"
            echo ''
            echo "Uploaded file: \`$output\`"
            echo ''
            echo 'Download it from this run’s Artifacts section.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassMic-release-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
