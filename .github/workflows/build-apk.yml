name: Build GlassMic Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and native build tools
        run: |
          sdkmanager --install \
            'platforms;android-35' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;26.1.10909125' \
            'cmake;3.22.1'

      - name: Assemble release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare release APK and optionally sign it
        id: apk
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk_dir='app/build/outputs/apk/release'
          mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | sort)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            find "$apk_dir" -maxdepth 2 -type f -print || true
            exit 1
          fi
          input_apk="${apks[0]}"
          build_tools="${ANDROID_HOME}/build-tools/36.0.0"
          mkdir -p dist

          present=0
          for value in "$RELEASE_KEYSTORE_BASE64" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD"; do
            [[ -z "$value" ]] || present=$((present + 1))
          done
          if (( present > 0 && present < 4 )); then
            echo 'Release signing secrets are incomplete (all four required).' >&2
            exit 1
          fi

          if (( present == 4 )); then
            keystore="${RUNNER_TEMP}/glassmic-release.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            aligned='dist/GlassMic-release-aligned.apk'
            "$build_tools/zipalign" -f -P 16 4 "$input_apk" "$aligned"
            output='dist/GlassMic-release-signed.apk'
            "$build_tools/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass env:RELEASE_STORE_PASSWORD \
              --key-pass env:RELEASE_KEY_PASSWORD \
              --out "$output" "$aligned"
            "$build_tools/apksigner" verify --verbose "$output"
            rm -f "$aligned" "$keystore"
          elif "$build_tools/apksigner" verify "$input_apk" >/dev/null 2>&1; then
            output='dist/GlassMic-release-signed.apk'
            cp "$input_apk" "$output"
          else
            output='dist/GlassMic-release-unsigned.apk'
            cp "$input_apk" "$output"
            echo 'No signing secrets provided: uploading an unsigned release APK.'
          fi

          test -s "$output"
          sha256sum "$output"
          echo "path=$output" >> "$GITHUB_OUTPUT"
          {
            echo '### GlassMic Release APK'
            echo ''
            echo "Build output: \`$input_apk\`"
            echo ''
            echo "Uploaded APK: \`$output\`"
            echo ''
            echo 'Get the APK from the Artifacts section of this run.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassMic-release-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
